<html lang="es">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8F9FA;color:#111;max-width:640px;margin:0 auto;-webkit-text-size-adjust:100%}

/* LOADING */
#loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
#loading .spin{width:36px;height:36px;border:3px solid #e5e5e5;border-top-color:#1D9E75;border-radius:50%;animation:spin .7s linear infinite}
#loading p{font-size:14px;color:#888}
@keyframes spin{to{transform:rotate(360deg)}}

.screen{display:none}.screen.active{display:block}

/* HEADER */
.hdr{padding:14px 16px;background:#fff;border-bottom:1px solid #EBEBEB;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.hdr h1{font-size:17px;font-weight:700;flex:1;color:#111}
.hdr .sub{font-size:11px;color:#999;margin-bottom:1px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.back{background:none;border:none;cursor:pointer;color:#555;font-size:24px;padding:4px;display:flex;align-items:center;min-width:36px;min-height:44px}

/* PROGRESO */
.prog-wrap{background:#fff;border-bottom:1px solid #EBEBEB;padding:10px 16px}
.prog-bar{height:4px;background:#EBEBEB;border-radius:2px;margin-bottom:6px}
.prog-fill{height:100%;background:#1D9E75;border-radius:2px;transition:width .4s}
.prog-row{display:flex;justify-content:space-between;align-items:center}
.prog-txt{font-size:12px;color:#888}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#1D9E75;display:inline-block;margin-right:4px}
.sync-lbl{font-size:11px;color:#1D9E75;font-weight:600}

/* SECCIÓN */
.sec-label{font-size:10px;font-weight:700;color:#BBB;letter-spacing:.08em;text-transform:uppercase;padding:16px 16px 6px}

/* TARJETA SERVICIO */
.srv-card{background:#fff;border:1px solid #EBEBEB;border-radius:12px;margin:0 12px 8px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px}
.srv-card:active{background:#F5F5F5}
.srv-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic-azul{background:#EBF3FF}.ic-purp{background:#F0EEFF}
.srv-main{flex:1;min-width:0}
.srv-nombre{font-size:15px;font-weight:700;color:#111;line-height:1.2}
.srv-jefe{font-size:12px;color:#888;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv-prog{display:flex;gap:4px;margin-top:6px}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.pill-ok{background:#D1FAE5;color:#065F46}
.pill-no{background:#F3F4F6;color:#9CA3AF}
.srv-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.badge{font-size:11px;padding:4px 9px;border-radius:8px;font-weight:700;white-space:nowrap}
.b-pend{background:#F3F4F6;color:#9CA3AF}
.b-curso{background:#FEF3C7;color:#92400E}
.b-rel{background:#D1FAE5;color:#065F46}
.hora-txt{font-size:10px;color:#CCC}

/* FICHA */
.save-bar{font-size:11px;display:flex;align-items:center;gap:5px;padding:5px 16px;background:#fff;border-bottom:1px solid #EBEBEB;color:#BBB}
.save-bar.g{color:#F59E0B}.save-bar.ok{color:#1D9E75}.save-bar.err{color:#EF4444}
.sec{border-bottom:1px solid #EBEBEB;background:#fff}
.sec-h{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;min-height:50px}
.sec-h:active{background:#FAFAFA}
.sec-t{font-size:14px;font-weight:700;color:#111;display:flex;align-items:center;gap:8px}
.sec-t i{font-size:17px;color:#888}
.sec-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:4px}
.chev{font-size:18px;color:#CCC;transition:transform .2s}
.open .chev{transform:rotate(180deg)}
.sec-body{padding:16px;background:#FAFAFA;border-top:1px solid #EBEBEB}
.collapsed .sec-body{display:none}

/* ORGANIGRAMA */
.jefe-box{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#EEF2FF;border-radius:10px;margin-bottom:12px;border:1px solid #C7D2FE}
.jefe-box label{font-size:12px;color:#4338CA;font-weight:700;white-space:nowrap;flex-shrink:0}
.jefe-box input{flex:1;font-size:14px;padding:6px 8px;border:1px solid #C7D2FE;border-radius:8px;background:#fff;color:#111;font-family:inherit;min-width:0}
.jefe-box input:focus{outline:none;border-color:#4338CA}
.org-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EBEBEB}
.org-row:last-child{border-bottom:none}
.org-av{width:34px;height:34px;border-radius:50%;background:#EBF3FF;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#185FA5;flex-shrink:0}
.org-n{font-size:13px;font-weight:700;color:#111}
.org-r{font-size:11px;color:#888}
.org-warn{font-size:11px;color:#92400E;margin-top:10px;padding:8px 10px;background:#FFFBEB;border-radius:8px;border:1px solid #FDE68A;line-height:1.5}

/* CHECKLIST */
.obs-leyenda{font-size:11px;color:#888;background:#F3F4F6;padding:8px 10px;border-radius:8px;margin-bottom:12px;line-height:1.8}
.m2-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #EBEBEB}
.m2-row label{font-size:13px;color:#555;flex:1}
.m2-row input{width:80px;font-size:14px;padding:7px 10px;border:1px solid #DDD;border-radius:8px;text-align:center;font-family:inherit;background:#fff;color:#111}
.m2-row input:focus{outline:none;border-color:#1D9E75}
.cli-item{padding:12px 0;border-bottom:1px solid #EBEBEB}
.cli-item:last-child{border-bottom:none}
.cli-lbl{font-size:13px;font-weight:600;color:#111;margin-bottom:8px;line-height:1.4}
.brm-g{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.brm{height:34px;padding:0 10px;border:1.5px solid #DDD;border-radius:8px;background:#fff;cursor:pointer;font-size:12px;font-weight:700;color:#999;transition:all .1s}
.brm:active{transform:scale(.96)}
.brm.sC{background:#D1FAE5;color:#065F46;border-color:#34D399}
.brm.sCP{background:#FEF3C7;color:#92400E;border-color:#FBBF24}
.brm.sNC{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.brm.sNA{background:#F3F4F6;color:#6B7280;border-color:#D1D5DB}
.brm.sNV{background:#EDE9FE;color:#5B21B6;border-color:#C4B5FD}
.obs-nota{width:100%;font-size:13px;padding:8px 10px;border:1px solid #DDD;border-radius:8px;background:#fff;color:#111;resize:none;min-height:48px;font-family:inherit;line-height:1.5}
.obs-nota:focus{outline:none;border-color:#1D9E75}

/* ENTREVISTAS */
.tab-row{display:flex;background:#fff;border-bottom:1px solid #EBEBEB}
.tab-btn{flex:1;padding:12px 8px;border:none;background:none;cursor:pointer;font-size:13px;color:#999;border-bottom:2px solid transparent;font-weight:600;min-height:44px}
.tab-btn.active{color:#111;font-weight:700;border-bottom:2px solid #1D9E75}
.tab-c{display:none;padding:14px 16px;background:#FAFAFA}
.tab-c.active{display:block}
.bl-ent{font-size:10px;font-weight:700;color:#1D9E75;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid #E5FAF2}
.preg-item{margin-bottom:12px}
.preg-txt{font-size:13px;color:#555;margin-bottom:6px;line-height:1.5;font-weight:500}
.preg-item textarea{width:100%;font-size:13px;padding:9px 10px;border:1px solid #DDD;border-radius:8px;background:#fff;color:#111;resize:none;min-height:54px;font-family:inherit;line-height:1.5}
.preg-item textarea:focus{outline:none;border-color:#1D9E75}
.grab-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:10px;border:1.5px solid #DDD;background:#fff;cursor:pointer;font-size:14px;font-weight:700;color:#111;min-height:50px;margin-bottom:8px}
.grab-btn.rec{background:#FEE2E2;border-color:#FCA5A5;color:#991B1B}
.grab-timer{font-size:13px;color:#888;text-align:center;margin-bottom:10px;font-variant-numeric:tabular-nums;font-weight:600}
.audio-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border:1px solid #EBEBEB;border-radius:8px;margin-bottom:6px}
.audio-item span{font-size:12px;color:#666;flex:1}

/* FOTOS */
.foto-ops{display:flex;gap:8px;margin-bottom:10px}
.foto-op{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:14px 8px;border-radius:10px;border:1.5px solid #DDD;background:#fff;cursor:pointer;font-size:13px;font-weight:700;color:#111;min-height:66px}
.foto-op:active{background:#F5F5F5}
.foto-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foto-th{aspect-ratio:1;background:#F0F0F0;border-radius:10px;overflow:hidden;position:relative}
.foto-th img{width:100%;height:100%;object-fit:cover}
.foto-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);font-size:10px;color:#fff;padding:4px 6px}

/* NOTAS */
.notas-area{width:100%;min-height:90px;font-size:14px;padding:10px;border:1px solid #DDD;border-radius:8px;background:#fff;color:#111;resize:none;font-family:inherit;line-height:1.6}
.notas-area:focus{outline:none;border-color:#1D9E75}

/* AVISO */
.aviso{border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12px;line-height:1.6;display:none}
.aviso.err{background:#FEE2E2;border:1px solid #FECACA;color:#991B1B}
.aviso strong{display:block;margin-bottom:2px;font-size:13px}

/* ACTION BAR */
.action-bar{padding:12px 16px;display:flex;gap:8px;border-top:1px solid #EBEBEB;background:#fff;position:sticky;bottom:0}
.btn-rel{flex:1;padding:13px;border-radius:10px;border:2px solid #1D9E75;background:#D1FAE5;color:#065F46;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px}
.btn-rel.ya{background:#1D9E75;color:#fff;border-color:#1D9E75}
.btn-save{padding:13px 16px;border-radius:10px;border:1.5px solid #DDD;background:#fff;color:#111;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:50px}

/* GALERÍA */
.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px}
.gal-th{background:#F5F5F5;border:1px solid #EBEBEB;border-radius:10px;overflow:hidden}
.gal-th img{width:100%;aspect-ratio:1;object-fit:cover}
.gal-info{padding:6px 8px}
.gal-srv{font-size:11px;font-weight:700;color:#111}
.gal-hora{font-size:10px;color:#BBB;margin-top:1px}
.empty{padding:50px 16px;text-align:center;color:#BBB;font-size:13px;line-height:2;grid-column:1/-1}

/* HALLAZGOS */
.hall-label{font-size:12px;color:#888;font-weight:700;margin-bottom:6px}
.hall-ta{width:100%;font-size:14px;padding:10px;border:1px solid #DDD;border-radius:10px;background:#fff;color:#111;resize:none;font-family:inherit;line-height:1.6}
.hall-ta:focus{outline:none;border-color:#1D9E75}
.btn-hall{width:100%;padding:14px;border-radius:10px;border:2px solid #1D9E75;background:#D1FAE5;color:#065F46;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
.btn-reset{width:100%;padding:12px;border-radius:10px;border:1px solid #FECACA;background:#FEE2E2;color:#991B1B;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px}

/* NAV */
.nav{display:flex;border-top:1px solid #EBEBEB;background:#fff;position:sticky;bottom:0}
.nav-btn{flex:1;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;min-height:52px}
.nav-btn span{font-size:10px;color:#BBB;font-weight:600}
.nav-btn i{font-size:22px;color:#BBB}
.nav-btn.active i,.nav-btn.active span{color:#1D9E75}

/* TOAST */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>

// ============================================================
// FIRESTORE
// ============================================================
function docRef(clave){ return db.collection('visitas').doc(VID).collection('servicios').doc(clave); }

function cargarDesdeFirestore(cb){
  db.collection('visitas').doc(VID).collection('servicios').get().then(function(snap){
    snap.forEach(function(doc){ STATE[doc.id]=doc.data(); });
    db.collection('visitas').doc(VID).get().then(function(vdoc){
      if(vdoc.exists){ var d=vdoc.data(); STATE['_hallazgos']=d.hallazgos||''; STATE['_pendientes']=d.pendientes||''; }
      cb();
    });
  }).catch(function(){ cb(); });
}

function guardarServicio(idx){
  setSave('g');
  var s=SD[idx];
  var clave=s.c;
  var cur=STATE[clave]||{};
  docRef(clave).set(cur,{merge:true})
    .then(function(){ setSave('ok'); })
    .catch(function(e){ console.error(e); setSave('err'); });
}

function setField(clave,field,val){
  if(!STATE[clave]) STATE[clave]={};
  if(typeof field==='object'){ Object.assign(STATE[clave],field); }
  else { STATE[clave][field]=val; }
}

function guardarHallazgos(){
  STATE['_hallazgos']=document.getElementById('h-txt').value;
  STATE['_pendientes']=document.getElementById('p-txt').value;
  db.collection('visitas').doc(VID).set({
    hallazgos:STATE['_hallazgos'],
    pendientes:STATE['_pendientes'],
    updated:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).catch(function(e){console.error(e);});
}

// ============================================================
// STORAGE
// ============================================================
function subirStorage(dataUrl,path,contentType,label){
  var b64=dataUrl.includes(',')?dataUrl.split(',')[1]:dataUrl;
  var bc=atob(b64); var ba=new Uint8Array(bc.length);
  for(var i=0;i<bc.length;i++) ba[i]=bc.charCodeAt(i);
  storage.ref(path).put(new Blob([ba],{type:contentType}))
    .then(function(){ toast(label+' guardado ✓'); })
    .catch(function(e){ console.error(e); toast('Error subiendo '+label); });
}

// ============================================================
// MICRÓFONO
// ============================================================
function toggleGrab(tipo){
  var btn=document.getElementById('gb-'+tipo),timer=document.getElementById('gt-'+tipo),av=document.getElementById('av-'+tipo),key='g_'+tipo;
  if(mrecs[key]&&mrecs[key].state==='recording'){
    mrecs[key].stop();clearInterval(gtimers[key]);
    btn.classList.remove('rec');btn.innerHTML='<i class="ti ti-microphone" style="font-size:20px"></i> Grabar entrevista '+(tipo==='j'?'jefe':'asistencial');
    timer.style.display='none';gseg[tipo]=0;if(av){av.style.display='none';}
  } else {
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      if(av){av.style.display='none';}
      var mr=new MediaRecorder(stream),chunks=[];
      mr.ondataavailable=function(e){chunks.push(e.data);};
      mr.onstop=function(){
        var blob=new Blob(chunks,{type:'audio/webm'});
        var reader=new FileReader();
        reader.onload=function(ev){
          var dataUrl=ev.target.result;
          var ahora=new Date(),hora=ahora.getHours()+':'+String(ahora.getMinutes()).padStart(2,'0');
          var tNombre=tipo==='j'?'jefe':'asistencial',s=SD[sIdx];
          var clave=s.c; if(!STATE[clave]) STATE[clave]={};
          if(!STATE[clave].audios) STATE[clave].audios=[];
          var path='Audios/'+s.c+'_'+tNombre+'/'+s.c+'_'+tNombre+'_'+mkts()+'.webm';
          var b64=dataUrl.split(',')[1];
          var bc=atob(b64);var ba=new Uint8Array(bc.length);
          for(var i=0;i<bc.length;i++) ba[i]=bc.charCodeAt(i);
          var blob=new Blob([ba],{type:'audio/webm'});
          var cont=document.getElementById('ad-'+tipo);
          if(cont){var d=document.createElement('div');d.className='audio-item';d.innerHTML='<i class="ti ti-file-music" style="font-size:16px;color:#888"></i><span>'+hora+' — subiendo...</span>';cont.appendChild(d);}
          storage.ref(path).put(blob).then(function(){
            return storage.ref(path).getDownloadURL();
          }).then(function(url){
            STATE[clave].audios.push({url:url,hora:hora,tipo:tNombre});
            STATE[clave].audios_count=(STATE[clave].audios_count||0)+1;
            if(d) d.querySelector('span').textContent=hora;
            guardarServicio(sIdx);
            toast('Audio guardado ✓');
          }).catch(function(err){console.error(err);toast('Error subiendo audio');});
        };
        reader.readAsDataURL(blob);stream.getTracks().forEach(function(t){t.stop();});
      };
      mr.start();mrecs[key]=mr;
      btn.classList.add('rec');btn.innerHTML='<i class="ti ti-player-stop" style="font-size:20px"></i> Detener grabación';
      timer.style.display='block';gseg[tipo]=0;
      gtimers[key]=setInterval(function(){gseg[tipo]++;var m=Math.floor(gseg[tipo]/60),s=gseg[tipo]%60;timer.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');},1000);
    }).catch(function(){
      if(av){av.className='aviso err';av.innerHTML='<strong><i class="ti ti-microphone-off" style="font-size:13px;vertical-align:-2px"></i> Micrófono bloqueado</strong>Ícono de candado → Permisos del sitio → Micrófono → Permitir. Luego recargá la página.';av.style.display='block';}
      btn.innerHTML='<i class="ti ti-microphone-off" style="font-size:20px"></i> Micrófono bloqueado — ver arriba';
    });
  }
}

  }).catch(function(){

    document.getElementById('fi-gal').click();
  });
}

function procesarFoto(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var ahora=new Date(),hora=ahora.getHours()+':'+String(ahora.getMinutes()).padStart(2,'0');
    var s=SD[sIdx],clave=s.c;
    var path='Fotos/'+s.c+'/'+s.c+'_'+mkts()+'.jpg';
    var b64=ev.target.result.split(',')[1];
    var bc=atob(b64);var ba=new Uint8Array(bc.length);
    for(var i=0;i<bc.length;i++) ba[i]=bc.charCodeAt(i);
    var blob=new Blob([ba],{type:'image/jpeg'});
    var ref=storage.ref(path);
    var grid=document.getElementById('fg-'+sIdx);
    if(grid){
      var th=document.createElement('div');th.className='foto-th';
      th.innerHTML='<img src="'+ev.target.result+'"><div class="foto-lbl">'+hora+' — subiendo...</div>';
      th.id='ft-'+mkts();grid.appendChild(th);
    }
    ref.put(blob).then(function(){
      return ref.getDownloadURL();
    }).then(function(url){
      if(!STATE[clave]) STATE[clave]={};
      if(!STATE[clave].fotos) STATE[clave].fotos=[];
      STATE[clave].fotos.push({url:url,hora:hora});
      STATE[clave].fotos_count=(STATE[clave].fotos_count||0)+1;
      if(th) th.querySelector('.foto-lbl').textContent=hora;
      th.querySelector('img').src=url;
      guardarServicio(sIdx);
      toast('Foto guardada ✓');
    }).catch(function(err){
      console.error(err);toast('Error subiendo foto');
    });
  };
  reader.readAsDataURL(file);e.target.value='';
}

function renderGaleria(){
  var grid=document.getElementById('gal-grid'),all=[];
  SD.forEach(function(s){var cur=STATE[s.c]||{};(cur.fotos||[]).forEach(function(f){all.push({src:f.src,hora:f.hora,srv:s.n});});});
  if(all.length===0){grid.innerHTML='<div class="empty">Sin fotos todavía.</div>';return;}
  grid.innerHTML=all.map(function(f){return '<div class="gal-th"><img src="'+(f.url||f.src||'')+'" alt="'+f.srv+'"><div class="gal-info"><div class="gal-srv">'+f.srv+'</div><div class="gal-hora">'+f.hora+'</div></div></div>';}).join('');
}

// ============================================================
// BADGES
// ============================================================
function actuBadge(idx){
  var e=(STATE[SD[idx].c]&&STATE[SD[idx].c].estado)||'pendiente';
  var b=document.getElementById('bdg-'+idx);if(!b)return;
  b.className='badge';
  if(e==='pendiente'){b.classList.add('b-pend');b.textContent='Pendiente';}
  else if(e==='curso'){b.classList.add('b-curso');b.textContent='En curso';}
  else{b.classList.add('b-rel');b.textContent='Relevado ✓';}
}

function actuBadgeFicha(idx){
  var e=(STATE[SD[idx].c]&&STATE[SD[idx].c].estado)||'pendiente';
  var b=document.getElementById('f-badge');b.className='badge';
  if(e==='pendiente'){b.classList.add('b-pend');b.textContent='Pendiente';}
  else if(e==='curso'){b.classList.add('b-curso');b.textContent='En curso';}
  else{b.classList.add('b-rel');b.textContent='Relevado ✓';}
  var br=document.getElementById('btn-rel');
  if(e==='relevado'){br.classList.add('ya');br.innerHTML='<i class="ti ti-check" style="font-size:17px"></i> Relevado';}
  else{br.classList.remove('ya');br.innerHTML='<i class="ti ti-check" style="font-size:17px"></i> Marcar relevado';}
}

// ============================================================
// AUTOGUARDADO
// ============================================================
function autoguardar(){
  setSave('g');clearTimeout(stout);
  stout=setTimeout(function(){guardarServicio(sIdx);},2000);
}

function setSave(st){
  var bar=document.getElementById('save-bar'),txt=document.getElementById('save-txt');if(!bar||!txt)return;
  bar.className='save-bar '+(st==='g'?'g':st==='ok'?'ok':st==='err'?'err':'');
  if(st==='g')txt.textContent='Guardando...';
  else if(st==='ok')txt.textContent='Guardado en Firestore ✓';
  else if(st==='err')txt.textContent='Error al guardar';
  else txt.textContent='Listo';
}

// ============================================================
// RESUMEN Y RESET
// ============================================================
function generarResumen(){
  var r='RESUMEN DE CIERRE — VISITA 1\n\n';
  SD.forEach(function(s){
    var cur=STATE[s.c]||{};
    r+='=== '+s.n.toUpperCase()+' ===\nEstado: '+(cur.estado||'pendiente')+'\nResponsable: '+(cur.jefe_presente||s.jd)+'\nNotas: '+(cur.notas||'(sin notas)')+'\n\n';
  });
  r+='HALLAZGOS:\n'+(STATE['_hallazgos']||'')+'\n\nPENDIENTES:\n'+(STATE['_pendientes']||'');
  var w=window.open('','_blank');
  if(w) w.document.write('<pre style="font-family:monospace;padding:20px;font-size:14px;line-height:1.8;white-space:pre-wrap">'+r+'</pre>');
}

function resetearVisita(){
  if(!confirm('¿Seguro querés borrar todos los datos de esta visita?\n\nEsta acción elimina todo de Firestore y no se puede deshacer.'))return;
  var batch=db.batch();
  SD.forEach(function(s){batch.delete(docRef(s.c));});
  batch.delete(db.collection('visitas').doc(VID));
  batch.commit().then(function(){
    STATE={};localStorage.clear();toast('Visita reseteada');renderHome();mostrar('home');
  }).catch(function(e){console.error(e);toast('Error al resetear');});
}

// ============================================================
// UTILS
// ============================================================
function mkts(){var a=new Date();return a.getFullYear()+''+String(a.getMonth()+1).padStart(2,'0')+''+String(a.getDate()).padStart(2,'0')+'_'+String(a.getHours()).padStart(2,'0')+''+String(a.getMinutes()).padStart(2,'0')+''+String(a.getSeconds()).padStart(2,'0');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

window.addEventListener('load',function(){
  cargarDesdeFirestore(function(){
    document.getElementById('loading').style.display='none';
    var ht=document.getElementById('h-txt'),pt=document.getElementById('p-txt');
    if(ht)ht.value=STATE['_hallazgos']||'';
    if(pt)pt.value=STATE['_pendientes']||'';
    renderHome();
    mostrar('home');
  });
});
