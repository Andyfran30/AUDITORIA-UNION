function guardarEnFirestore(idx) {
  setSaveStatus('g');
  var s = SD[idx];
  var obs = lsJ('obs_'+idx,{});
  var obN = lsJ('obsn_'+idx,{});
  var pj = lsJ('p_j_'+idx,{});
  var pa = lsJ('p_a_'+idx,{});
  var jefes = getJefes();
  var estados = getEstados();
  var doc = {
    servicio: s.c,
    nombre: s.n,
    estado: estados[idx]||'pendiente',
    jefe_presente: jefes[idx]||s.jd,
    m2: ls('m2_'+idx),
    notas: ls('notas_'+idx),
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    obs: obs,
    obs_notas: obN,
    entrevista_jefe: pj,
    entrevista_asistencial: pa,
    fotos_count: getFotos().filter(function(f){return f.idx===idx;}).length,
    audios_count: getAudios().filter(function(a){return a.idx===idx;}).length
  };
  db.collection('visitas').doc(VISITA_ID)
    .collection('servicios').doc(s.c)
    .set(doc)
    .then(function(){ setSaveStatus('ok'); toast('Guardado en Firestore ✓'); })
    .catch(function(e){ console.error(e); setSaveStatus('err'); toast('Error al guardar'); });
}

// ============================================================
// FIREBASE STORAGE — subir archivos
// ============================================================
function subirStorage(dataUrl, path, contentType, label) {
  var base64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
  var byteChars = atob(base64);
  var bytes = new Uint8Array(byteChars.length);
  for(var i=0;i<byteChars.length;i++) bytes[i]=byteChars.charCodeAt(i);
  var blob = new Blob([bytes],{type:contentType});
  storage.ref(path).put(blob)
    .then(function(){ toast(label+' guardado en Firebase ✓'); })
    .catch(function(e){ console.error(e); toast('Error subiendo '+label); });
}

function toggleGrab(tipo){
  var btn=document.getElementById('gb-'+tipo);
  var timer=document.getElementById('gt-'+tipo);
  var av=document.getElementById('av-'+tipo);
  var key='g_'+tipo;
  if(mrecs[key]&&mrecs[key].state==='recording'){
    mrecs[key].stop();clearInterval(gtimers[key]);
    btn.classList.remove('rec');
    btn.innerHTML='<i class="ti ti-microphone" style="font-size:20px"></i> Grabar entrevista '+(tipo==='j'?'jefe':'asistencial');
    timer.style.display='none';gseg[tipo]=0;
    if(av){av.className='aviso';av.style.display='none';}
  } else {
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      if(av){av.style.display='none';}
      var mr=new MediaRecorder(stream);var chunks=[];
      mr.ondataavailable=function(e){chunks.push(e.data);};
      mr.onstop=function(){
        var blob=new Blob(chunks,{type:'audio/webm'});
        var reader=new FileReader();
        reader.onload=function(ev){
          var dataUrl=ev.target.result;
          var ahora=new Date();
          var hora=ahora.getHours()+':'+String(ahora.getMinutes()).padStart(2,'0');
          var tNombre=tipo==='j'?'jefe':'asistencial';
          var s=SD[sIdx];
          var audioObj={idx:sIdx,dataUrl:dataUrl,hora:hora,servicio:s.n,clave:s.c,tipo:tNombre};
          var audios=getAudios();audios.push(audioObj);setAudios(audios);
          var cont=document.getElementById('ad-'+tipo);
          if(cont){var d=document.createElement('div');d.className='audio-item';d.innerHTML='<i class="ti ti-file-music" style="font-size:17px;color:#666"></i><span>'+s.c+' · '+hora+'</span><audio controls src="'+dataUrl+'" style="height:30px;flex-shrink:0"></audio>';cont.appendChild(d);}
          subirStorage(dataUrl,'Audios/'+s.c+'_'+tNombre+'/'+s.c+'_'+tNombre+'_'+mkts()+'.webm','audio/webm','Audio');
          guardarEnFirestore(sIdx);
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(function(t){t.stop();});
      };
      mr.start();mrecs[key]=mr;
      btn.classList.add('rec');btn.innerHTML='<i class="ti ti-player-stop" style="font-size:20px"></i> Detener grabación';
      timer.style.display='block';gseg[tipo]=0;
      gtimers[key]=setInterval(function(){gseg[tipo]++;var m=Math.floor(gseg[tipo]/60);var s=gseg[tipo]%60;timer.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');},1000);
    }).catch(function(){
      if(av){av.className='aviso err';av.innerHTML='<strong><i class="ti ti-microphone-off" style="font-size:13px;vertical-align:-2px"></i> Micrófono bloqueado</strong>Ícono de candado en la barra → Permisos del sitio → Micrófono → Permitir. Luego recargá la página.';av.style.display='block';}
      btn.innerHTML='<i class="ti ti-microphone-off" style="font-size:20px"></i> Micrófono bloqueado — ver arriba';
    });
  }
}

    document.getElementById('fi-gal').click();
  });
}

function procesarFoto(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var ahora=new Date();var hora=ahora.getHours()+':'+String(ahora.getMinutes()).padStart(2,'0');
    var s=SD[sIdx];
    var foto={idx:sIdx,src:ev.target.result,hora:hora,servicio:s.n,clave:s.c};
    var fotos=getFotos();fotos.push(foto);setFotos(fotos);
    var grid=document.getElementById('fg-'+sIdx);
    if(grid){var th=document.createElement('div');th.className='foto-th';th.innerHTML='<img src="'+ev.target.result+'"><div class="foto-lbl">'+hora+'</div>';grid.appendChild(th);}
    subirStorage(ev.target.result,'Fotos/'+s.c+'/'+s.c+'_'+mkts()+'.jpg','image/jpeg','Foto');
    guardarEnFirestore(sIdx);toast('Foto agregada');
  };
  reader.readAsDataURL(file);e.target.value='';
}

function setSaveStatus(st){
  var ind=document.getElementById('save-ind');var txt=document.getElementById('save-txt');if(!ind||!txt)return;
  ind.className='save-ind '+(st==='g'?'g':st==='ok'?'ok':st==='err'?'err':'');
  if(st==='g')txt.textContent='Guardando...';
  else if(st==='ok')txt.textContent='Guardado ✓';
  else if(st==='err')txt.textContent='Error al guardar';
  else txt.textContent='Listo';
}

// ============================================================
// RESUMEN Y RESET
// ============================================================
function generarResumen(){
  var r='RESUMEN DE CIERRE — VISITA 1\n\n';
  var estados=getEstados();var jefes=getJefes();
  SD.forEach(function(s,idx){
    r+='=== '+s.n.toUpperCase()+' ===\nEstado: '+estados[idx]+'\nResponsable: '+(jefes[idx]||s.jd)+'\nNotas: '+(ls('notas_'+idx)||'(sin notas)')+'\n\n';
  });
  r+='HALLAZGOS:\n'+ls('hallazgos')+'\n\nPENDIENTES:\n'+ls('pendientes');
  var w=window.open('','_blank');
  if(w)w.document.write('<pre style="font-family:monospace;padding:20px;font-size:14px;line-height:1.8;white-space:pre-wrap">'+r+'</pre>');
}

function resetearVisita(){
  if(!confirm('¿Seguro querés borrar todos los datos de esta visita? No se puede deshacer.'))return;
  localStorage.clear();location.reload();
}

// ============================================================
// UTILS
// ============================================================
function mkts(){var a=new Date();return a.getFullYear()+''+String(a.getMonth()+1).padStart(2,'0')+''+String(a.getDate()).padStart(2,'0')+'_'+String(a.getHours()).padStart(2,'0')+''+String(a.getMinutes()).padStart(2,'0')+''+String(a.getSeconds()).padStart(2,'0');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

// ============================================================
// INIT
// ============================================================
function init(){
  actuProgreso();
  var jefes=getJefes();
  SD.forEach(function(s,idx){var l=document.getElementById('jlbl-'+idx);if(l&&jefes[idx])l.textContent=jefes[idx];});
  document.getElementById('h-txt').value=ls('hallazgos');
  document.getElementById('p-txt').value=ls('pendientes');
  var ss=document.getElementById('sync-status');
  if(ss)ss.textContent='Firebase ✓';
}

window.addEventListener('load',init);
</script>
